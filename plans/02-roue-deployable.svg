ge de rayon : insert rapporte rayon 3 mm (Kt 1.8 au lieu de 2.5 sur percage brut)</text><text class="t" x="830.0" y="414.0" text-anchor="start">DETAIL B — jonction d'arcs a tenon conique 6°</text><path class="tr" d="M830,430 h126 l 46,-13 v 26 l -46,-13 M830,482 h126 l 46,13 v -26 l -46,13"/><path class="tr" d="M1130,430 h-102 M1130,482 h-102"/><path class="tr" d="M1002,417 L1028,417 M1002,495 L1028,495"/><text class="ts" x="830.0" y="514.0" text-anchor="start">la precontrainte des rayons plaque les arcs : le joint ne travaille QU'EN COMPRESSION</text><text class="ts" x="830.0" y="530.0" text-anchor="start">excentricite e = M/N &lt; h/6 verifiee sur les 8 joints, tous cas de charge</text><text class="t" x="830.0" y="604.0" text-anchor="start">DETAIL C — moyeu a brides ecartables (mise en tension par came)</text><rect class="tr" x="830" y="660" width="300" height="34" rx="4"/><path class="tr" d="M850,660 l -14,-46 h 22 l 14,46 z"/><path class="tr" d="M850,694 l -14,46 h 22 l 14,-46 z"/><path class="tr" d="M1094,660 l -14,-46 h 22 l 14,46 z"/><path class="tr" d="M1094,694 l -14,46 h 22 l 14,-46 z"/><path class="tr2" d="M950,650 h 60 v 54 h -60 z"/><circle class="seg" cx="980.0" cy="677.0" r="16.0"/><line class="seg" x1="980.0" y1="677.0" x2="980.0" y2="614.0"/><text class="tc" x="990.0" y="624.0" text-anchor="start">levier de came</text><line class="axe" x1="810.0" y1="677.0" x2="1160.0" y2="677.0"/><text class="ts" x="830.0" y="760.0" text-anchor="start">course de came 5.0 mm -&gt; allongement 0.34 mm par rayon -&gt; 700 N ; effort au levier ~96 N crete</text><text class="ts" x="830.0" y="776.0" text-anchor="start">8 secteurs a baionnette : les 8 arcs s'accrochent en une rotation de 1/16e de tour</text><text class="t" x="60.0" y="780.0" text-anchor="start">SEQUENCE DE MONTAGE D'UNE ROUE (≈ 25 s)</text><rect class="fin" x="70" y="800" width="230" height="150" rx="8"/><path class="seg" d="M100,902 q 22,-46 44,0"/><path class="seg" d="M144,902 q 22,-46 44,0"/><path clas