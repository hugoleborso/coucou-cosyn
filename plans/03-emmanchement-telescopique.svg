</style><rect width="1500" height="760" fill="#fbfaf8"/><text class="tt" x="60.0" y="52.0" text-anchor="start">COSYN-30 — emmanchement telescopique a expandeur conique (coupe)</text><text class="ts" x="60.0" y="74.0" text-anchor="start">identique pour la poutre principale (E1, E2), la colonne de direction (E3) et la tige de selle (E4, E5)</text><rect class="tr" x="130" y="300" width="420" height="7.48"/><rect class="tr" x="130" y="448.91999999999996" width="420" height="7.48"/><rect class="tr" x="352.8" y="308.5" width="627.2" height="7.48"/><rect class="tr" x="352.8" y="440.41999999999996" width="627.2" height="7.48"/><rect class="hach" x="130" y="300" width="420" height="7.48"/><rect class="hach" x="130" y="448.91999999999996" width="420" height="7.48"/><rect class="hach" x="352.8" y="308.5" width="627.2" height="7.48"/><rect class="hach" x="352.8" y="440.41999999999996" width="627.2" height="7.48"/><rect class="seg" x="364.8" y="307.48" width="26" height="1" fill="#c0392b" opacity=".35"/><rect class="seg" x="364.8" y="447.9" width="26" height="1" fill="#c0392b" opacity=".35"/><rect class="seg" x="524" y="307.48" width="26" height="1" fill="#c0392b" opacity=".35"/><rect class="seg" x="524" y="447.9" width="26" height="1" fill="#c0392b" opacity=".35"/><path class="tr" d="M412.8,315.98 l 96,0 l 22,56 l -22,0 z"/><path class="tr" d="M412.8,440.41999999999996 l 96,0 l 22,-56 l -22,0 z"/><rect class="tr2" x="262.8" y="371.2" width="270" height="14" rx="3"/><circle class="tr" cx="252.8" cy="378.2" r="16"/><line class="seg" x1="252.8" y1="378.2" x2="202.8" y2="318.2"/><line class="axe" x1="100.0" y1="378.2" x2="1020.0" y2="378.2"/><line class="fin" x1="352.8" y1="280.0" x2="352.8" y2="306.0"/><line class="fin" x1="550.0" y1="280.0" x2="550.0" y2="306.0"/><line class="cote" x1="352.8" y1="306.0" x2="550.0" y2="306.0"/><circle cx="352.8" cy="306.0" r="2" fill="#0b6e99"/><circle cx="550.0" cy="306.0" r="2" fill="#0b6e99"/><text class="tc" x="451.4" y="302.0" text-anchor="middle">recouvrement 58 (mini calcule 20)</text><line class="fin" x1="130.0" y1="482.4" x2="130.0" y2="508.4"/><line class="fin" x1="550.0" y1="482.4" x2="550.0" y2="508.4"/><line class="cote" x1="130.0" y1="508.4" x2="550.0" y2="508.4"/><circle cx="130.0" cy="508.4" r="2" fill="#0b6e99"/><circle cx="550.0" cy="508.4" r="2" fill="#0b6e99"/><text class="tc" x="340.0" y="504.4" text-anchor="middle">tube exterieur Ø46x2.2</text><line class="fin" x1="352.8" y1="536.4" x2="352.8" y2="562.4"/><line class="fin" x1="980.0" y1="536.4" x2="980.0" y2="562.4"/><line class="cote" x1="352.8" y1="562.4" x2="980.0" y2="562.4"/><circle cx="352.8" cy="562.4" r="2" fill="#0b6e99"/><circle cx="980.0" cy="562.4" r="2" fill="#0b6e99"/><text class="tc" x="666.4" y="558.4" text-anchor="middle">tube interieur Ø41x2.2</text><text class="t" x="130.0" y="540.0" text-anchor="start">1. Le cone 8° dilate la douille fendue : le jeu de coulissement (60 µm) est annule, donc AUCUN flou residuel a la direction.</text><text class="t" x="130.0" y="566.0" text-anchor="start">2. Sans expandeur, le basculement libre serait de 0.059° par liaison, soit 1.1 mm cumules au cintre — inacceptable.</text><text class="t" x="130.0" y="592.0" text-anchor="start">3. Effort de tirant calcule 1.1 a 2.6 kN selon la liaison, obtenu au couple de 1.3 a 3.2 N.m sur vis M6.</text><text class="t" x="130.0" y="618.0" text-anchor="start">4. Pression de matage sur portees : 6.8 a 10.5 MPa pour 25 MPa admissibles (bague PA66-CF sur alu anodise dur) -&gt; marge 2.4 a 3.7.</text><text class="t" x="130.0" y="644.0" text-anchor="start">5. Butee d'index usinee dans le tube interieur : la longueur deployee est repetable sans reglage.</text></svg>